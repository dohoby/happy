<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>唐诗三百首</title>
<script src="https://unpkg.com/pinyin-pro@3.20.0/dist/index.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="css/tang-poem.css">
</head>
<body>
<div class="container">
  <header>
    <div class="header-content">
      <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
      <div>
        <div class="page-title" id="page-title">唐诗三百首</div>
        <div class="header-subtitle">品读唐诗 · 传承经典</div>
      </div>
      <!-- 课程模式导航 -->
    <div id="lesson-nav" style="display:none;align-items:center;gap:8px">
      <button id="lesson-back" style="background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer"><i class="fas fa-arrow-left"></i> 返回</button>
      <button id="lesson-exit" style="background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer"><i class="fas fa-sign-out-alt"></i> 退出</button>
    </div>
    <div style="width:32px" id="header-spacer"></div>
    </div>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="搜索诗人、诗名或诗句...">
      <span class="search-icon"><i class="fas fa-search"></i></span>
    </div>
  </header>

  <div class="nav-overlay" id="nav-overlay"></div>
  <nav id="side-nav">
    <div class="nav-header">
      <h2><i class="fas fa-book-open"></i> 诗人列表</h2>
      <p>按诗人姓氏排序</p>
      <div class="nav-stats">
        <div class="nav-stat-item"><div class="nav-stat-value" id="poet-count">0</div><div class="nav-stat-label">位诗人</div></div>
        <div class="nav-stat-item"><div class="nav-stat-value" id="poem-count">0</div><div class="nav-stat-label">首诗歌</div></div>
      </div>
    </div>
    <div class="nav-content">
      <div style="display:flex;gap:8px;padding:10px 0">
        <button id="nav-fav-btn" style="flex:1;background:#f8f9fa;border:none;padding:10px;border-radius:8px;font-size:.85em;color:#2c3e50;cursor:pointer"><i class="fas fa-heart" style="color:#c0392b"></i> 我的收藏</button>
        <button id="nav-recent-btn" style="flex:1;background:#f8f9fa;border:none;padding:10px;border-radius:8px;font-size:.85em;color:#2c3e50;cursor:pointer"><i class="fas fa-clock" style="color:#2980b9"></i> 最近阅读</button>
      </div>
      <ul id="poet-list" class="poet-list"></ul>
    </div>
  </nav>

  <main class="main-content">
    <div id="search-results"></div>

    <!-- Home Page -->
    <div id="home-page" class="page active">
      <div class="card welcome-card fade-in-up">
        <div class="welcome-content">
          <div class="welcome-icon"><i class="fas fa-book-open"></i></div>
          <div class="welcome-title">品读唐诗 · 传承经典</div>
          <p>精选十六位唐代代表诗人，三百余首经典作品，<br>配有拼音标注、注释译文与语音朗读。</p>
        </div>
      </div>

      <div class="card daily-poem fade-in-up stagger-1" id="daily-poem">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span class="daily-badge"><i class="fas fa-sparkles"></i> 今日推荐</span>
          <span class="daily-date" id="daily-date"></span>
        </div>
        <div class="daily-title" id="daily-title"></div>
        <div class="daily-author" id="daily-author"><span class="daily-author-avatar"><i class="fas fa-user"></i></span><span id="daily-author-name"></span></div>
        <div class="daily-preview" id="daily-preview"></div>
      </div>

      <div id="recent-section" style="display:none">
        <h3 class="section-title"><i class="fas fa-clock"></i> 最近阅读</h3>
        <div class="poem-list" id="recent-list"></div>
      </div>
      <div id="fav-section" style="display:none">
        <h3 class="section-title"><i class="fas fa-heart"></i> 我的收藏</h3>
        <div class="poem-list" id="fav-list"></div>
      </div>
      <h3 class="section-title"><i class="fas fa-users"></i> 全部诗人</h3>
      <div class="poet-grid" id="poet-grid"></div>
    </div>

    <!-- Poet Poems Page -->
    <div id="poet-poems-page" class="page">
      <div class="card" style="background:linear-gradient(135deg,#34495e,#2c3e50);color:white;">
        <div style="display:flex;align-items:center;gap:12px;">
          <button id="back-to-poet-list" style="background:none;border:none;color:white;font-size:1.2em;cursor:pointer;"><i class="fas fa-arrow-left"></i></button>
          <div>
            <h2 id="current-poet-name" style="font-size:1.2em;">李白</h2>
            <p id="current-poet-count" style="font-size:.85em;opacity:.85;">10首作品</p>
          </div>
        </div>
      </div>
      <div id="poet-poems-list"></div>
    </div>

    <!-- Poem Detail Page -->
    <div id="poem-page" class="page">
      <button class="back-btn" id="back-btn"><i class="fas fa-arrow-left"></i> 返回</button>

      <div class="card poem-header">
        <h2 id="detail-title" class="poem-title"></h2>
        <div class="poem-author"><i class="fas fa-user"></i><span id="poet-name"></span></div>
      </div>

      <div class="nav-buttons">
        <button id="prev-poem" class="nav-poem-btn prev"><i class="fas fa-chevron-left"></i> 上一首</button>
        <div class="position-indicator" id="current-position">0/0</div>
        <button id="next-poem" class="nav-poem-btn">下一首 <i class="fas fa-chevron-right"></i></button>
      </div>

      <div class="card poem-content-card">
        <div class="display-toggles">
          <button class="display-toggle" id="toggle-single-line">单句分行</button>
          <button class="display-toggle" id="toggle-pinyin">隐藏拼音</button>
        </div>
        <div id="detail-content" class="poem-text"></div>
      </div>

      <div class="card">
        <div class="tabs">
          <button class="tab-btn active" data-tab="notes">注释</button>
          <button class="tab-btn" data-tab="translation">译文</button>
          <button class="tab-btn" data-tab="analysis">赏析</button>
        </div>
        <div class="tab-content active" id="tab-content"><div class="tab-pane" id="tab-pane"></div></div>
      </div>

      <div class="card voice-controls" id="voice-panel">
        <div class="wechat-tip" id="wechat-tip"><i class="fas fa-info-circle"></i> 微信内不支持语音朗读，请在系统浏览器中打开</div>
        <div class="voice-title" style="justify-content:space-between">
          <div style="display:flex;align-items:center;gap:8px"><i class="fas fa-volume-up"></i><span id="voice-panel-title">语音朗读</span></div>
          <button class="fav-btn" id="fav-btn"><i class="far fa-heart"></i> 收藏</button>
        </div>
        <div class="read-mode-toggle" id="read-mode-toggle">
          <button class="read-mode-btn active" data-mode="audio"><i class="fas fa-music"></i> 音频版</button>
          <button class="read-mode-btn" data-mode="slow"><i class="fas fa-book-reader"></i> 跟读版</button>
        </div>
        <div class="volume-control" id="volume-control">
          <div class="speed-label"><i class="fas fa-volume-up"></i><span>音量</span></div>
          <input type="range" id="volume-slider" min="0" max="100" value="80" class="volume-slider">
        </div>
        <div class="speed-control" id="speed-control">
          <div class="speed-label"><i class="fas fa-tachometer-alt"></i><span>朗读速度</span></div>
          <div class="speed-buttons">
            <button class="speed-btn" data-speed="0.5">0.5x</button>
            <button class="speed-btn" data-speed="0.75">0.75x</button>
            <button class="speed-btn" data-speed="1">1.0x</button>
            <button class="speed-btn" data-speed="1.25">1.25x</button>
          </div>
        </div>
        <div class="voice-select-control" id="voice-select-control" style="margin-bottom:12px">
          <div class="speed-label"><i class="fas fa-microphone"></i><span>朗读音色</span></div>
          <div class="speed-buttons">
            <button class="speed-btn" data-voice="xiaoxiao">女声温暖</button>
            <button class="speed-btn" data-voice="xiaoyi">女童活泼</button>
            <button class="speed-btn" data-voice="yunxia">少年可爱</button>
          </div>
        </div>
        <div class="voice-buttons">
          <button id="play-btn" class="voice-btn"><i class="fas fa-play"></i> 朗读</button>
          <button id="pause-btn" class="voice-btn pause" disabled><i class="fas fa-pause"></i> 暂停</button>
          <button id="stop-btn" class="voice-btn stop" disabled><i class="fas fa-stop"></i> 停止</button>
          <button id="loop-btn" class="voice-btn loop"><i class="fas fa-redo"></i> 循环</button>
          <button id="list-loop-btn" class="voice-btn list-loop"><i class="fas fa-list"></i> 连播</button>
          <button id="follow-btn" class="voice-btn follow"><i class="fas fa-book-reader"></i> 跟读</button>
        </div>
        <div class="voice-status" id="current-status"><i class="fas fa-info-circle"></i> 点击「朗读」播放语音</div>
      </div>

      <div class="card poet-info" id="poet-info-card">
        <h3><i class="fas fa-user"></i> 诗人简介</h3>
        <p id="poet-bio"></p>
      </div>

      <!-- 课程模式底部操作区 -->
      <div id="lesson-actions" style="display:none;margin-bottom:80px">
        <div class="card" style="padding:16px">
          <button id="complete-btn" style="width:100%;padding:14px;background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:10px"><i class="fas fa-check-circle"></i> ✅ 完成学习</button>
          <div style="display:flex;gap:10px">
            <button id="lesson-fav-btn" style="flex:1;padding:10px;background:#f5f0e8;border:1px solid #e8e0d0;border-radius:10px;font-size:14px;cursor:pointer;color:#2c3e50"><i class="far fa-heart"></i> 收藏</button>
            <button id="mastered-btn" style="flex:1;padding:10px;background:#f5f0e8;border:1px solid #e8e0d0;border-radius:10px;font-size:14px;cursor:pointer;color:#2c3e50"><i class="fas fa-thumbs-up"></i> 学会了</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <audio id="audio-player" style="display:none"></audio>
  <nav class="bottom-nav" id="bottom-nav">
    <button id="nav-home" class="nav-btn active"><i class="fas fa-home"></i><span>首页</span></button>
    <button id="nav-back" class="nav-btn hidden"><i class="fas fa-arrow-left"></i><span>返回</span></button>
    <button id="nav-random" class="nav-btn"><i class="fas fa-random"></i><span>随机</span></button>
  </nav>

  <!-- 课程模式底部导航 -->
  <nav id="lesson-bottom-nav" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #f5f0e8;box-shadow:0 -2px 8px rgba(0,0,0,0.05);display:flex;height:64px;z-index:100;align-items:center;justify-content:space-around;padding:0 16px">
    <button id="lesson-prev" style="background:none;border:none;color:#2c3e50;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px"><i class="fas fa-chevron-left"></i> 上一篇</button>
    <button id="lesson-next" style="background:none;border:none;color:#2c3e50;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px">下一篇 <i class="fas fa-chevron-right"></i></button>
  </nav>
</div>

<script src="js/tang-data.js"></script>
<script src="js/tang-poem.js"></script>
</body>
</html>
